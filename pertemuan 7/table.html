<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabel</title>
<style>
    td,
    th {
        border-bottom: 1px solid rgb(168, 181, 168);
        padding: 10px;
    }

    th {
        background-color: green;
        color: white;
        border: 1px solid rgb(50, 108, 50)
    }

    table {
        border-collapse: collapse;
        font-family: "Slabo 13px,", "sofia" Arial, Helvetica, sans-serif;
        width: 100%;
    }

    tbody>tr {
        cursor: pointer;
    }

    tbody>tr:hover {
        background-color: #c88585;
        color: rgb(227, 227, 227);
    }

    tfoot td {
        text-align: center;
    }

    tr:nth-child(odd) {
        background-color: #e7e7e7;
        color:#fff;
        text-shadow: 2px 2px 3px rgb(255, 0, 0), -2px -2px 5px black;
    }

    .tbl-responsive {
        overflow-x: auto;
        width: 300px;
    }

</style>
</head>

<body>
   <div class="tbl-responsive">
<table>
    <caption>Tabel Mahasiswa</caption>
    <thead>
        <tr>
            <th rowspan="2">NO</th>
            <th rowspan="2">NIM</th>
            <TH colspan="3">MAHASISWA</TH>
        <tr>
            <th>Nama</th>
            <th>Prodi</th>
            <th>Alamat</th>
        </tr>
    </thead>

    <tbody>
        <tr>
            <td>1</td>
            <td>2402011042</td>
            <td>Nurlaili</td>
            <td>teknik informatika</td>
            <td>m.bungo</td>
        </tr>
        <tr>
            <td>2</td>
            <td>2402011037</td>
            <td>Mirnawati</td>
            <td>teknik informatika</td>
            <td>tebo</td>
            
        </tr>
        <tr>
            <td>3</td>
            <td>2402011012</td>
            <td>Gita anggriani</td>
            <td>teknik informatika</td>
            <td>m.bungo</td>
        </tr>
    </tbody>
    <tfoot>
        <tr>
            <td colspan="4">jumlah</td>
            <td>3</td>
        </tr>
    </tfoot>
</table>
    </div>

</body>


</html>
